<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Locations</title>

  <style>
    body {
      margin: 0;
      background-color: #7db8f2;
      font-family: Arial, sans-serif;
    }

    /*Hamburger button + dropdown menu (same on every page)*/
    .header {
      position: relative;
      padding: 16px;
    }

    #menu-button {
      font-size: 36px;
      background: none;
      border: none;
      cursor: pointer;
    }

    #menu {
      display: none;
      position: absolute;
      top: 70px;
      left: 16px;
      width: 160px;
      padding: 10px;
      background-color: #3b37c4;
      border-radius: 12px;
    }

    #menu.open {
      display: block;
    }

    #menu a {
      display: block;
      padding: 8px;
      color: #4fd8f5;
      font-weight: bold;
      text-decoration: none;
    }

    /*Locations content */
    .content {
      max-width: 500px;
      margin: 0 auto;                 /* centers the content on big screens */
      padding: 0 16px 100px;          /* extra bottom space for the button */
      color: #3b37c4;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    .location {
      display: flex;                  /* star on the left, name on the right */
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      font-size: 18px;
    }

    .star {
      font-size: 32px;
    }

    /*Progress circle */
    /* The outer circle is grey with a blue slice (conic-gradient). */
    .circle {
      width: 220px;
      height: 220px;
      margin: 40px auto;
      border-radius: 50%;
      background: conic-gradient(#3b37c4 0% 33%, #808080 33% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The inner circle covers the middle, so only a ring shows. */
    .circle-inner {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background-color: #7db8f2;      /* same color as the page */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    /* ---------- Next button ---------- */
    .next-button {
      position: fixed;                /* stays in the corner while scrolling */
      bottom: 16px;
      right: 16px;
      padding: 14px 18px;
      background-color: #3b37c4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ---------- Bigger screens (tablets and computers) ---------- */
    @media (min-width: 700px) {
      h1 {
        font-size: 32px;
      }
      .location {
        font-size: 22px;
      }
      .circle {
        width: 300px;
        height: 300px;
      }
      .circle-inner {
        width: 230px;
        height: 230px;
        font-size: 56px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <button id="menu-button">&#9776;</button>

    <div id="menu">
      <a href="index.html">Home </a>
      <a href="qr-scan.html">Scan Code </a>
      <a href="#">Challenge of the Day </a>
      <a href="profile-page.html">My Profile </a>
      <a href="locations.html">My Locations </a>
      <a href="#">Progress </a>
      <a href="#">Log Out </a>
    </div>
  </div>

  <div class="content">
    <h1>Your Locations:</h1>

    <!-- &#9733; is a filled star, &#9734; is an empty star -->
    <div class="location">
      <span class="star">&#9733;</span>
      <span>Gladstone Middle School &#128205;</span>
    </div>

    <div class="location">
      <span class="star">&#9734;</span>
      <span>Carnegie Library of Hazelwood &#128205;</span>
    </div>

    <div class="location">
      <span class="star">&#9734;</span>
      <span>Pittsburgh Fountain of Life Church &#128205;</span>
    </div>

    <div class="circle" id="circle">
      <div class="circle-inner" id = "count">1/3</div>
    </div>
  </div>

  <button class = "next-button" id="next-button">Next Location &gt;</button>

  <script>
    // Click the hamburger button to show or hide the menu
    var button = document.getElementById("menu-button");
    var menu = document.getElementById("menu");

    button.onclick = function () {
      menu.classList.toggle("open");
    };
    // Stars and progress circle
    var stars = document.querySelectorAll(".star");   
    var circle = document.getElementById("circle");
    var count = document.getElementById("count");
 
    // Counts the filled stars, then updates the number and the circle
    function updateProgress() {
      var filled = 0;
      for (var i = 0; i < stars.length; i++) {
        if (stars[i].innerHTML === "\u2605") {       // \u2605 is the filled star
          filled = filled + 1;
        }
      }
 
      count.innerHTML = filled + "/" + stars.length;
 
      var percent = (filled / stars.length) * 100;
      circle.style.background =
        "conic-gradient(#3b37c4 0% " + percent + "%, #808080 " + percent + "% 100%)";
    }
 
    // Clicking "Next Location" fills the first empty star
    var nextButton = document.getElementById("next-button");
 
    nextButton.onclick = function () {
      for (var i = 0; i < stars.length; i++) {
        if (stars[i].innerHTML === "\u2606") {        // found an empty star
          stars[i].innerHTML = "\u2605";              // fill it
          break;                                      // stop looking
        }
      }
      updateProgress();
    };
  </script>
</body>
</html>
