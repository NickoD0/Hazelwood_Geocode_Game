<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan the QR Code</title>

  <Style>
    body {
      margin: 0;
      background-color: #7db8f2;
      font-family: Arial, sans-serif;
    }
    .header {
      position: relative;
      padding: 16px;
    }

    #menu-button {
      font-size: 36px;
      background: none;
      border: none;
      cursor: pointer;
    }

    #menu {
      display: none;
      position: absolute;
      top: 70px;
      left: 16px;
      width: 160px;
      padding: 10px;
      background-color: #3b37c4;
      border-radius: 12px;
    }

    #menu.open {
      display: block;
    }

    #menu a {
      display: block;
      padding: 8px;
      color: #4fd8f5;
      font-weight: bold;
      text-decoration: none;
    }

    .content {
      max-width: 400px;               
      margin: 60px auto 0;            
      padding: 0 16px 40px;
      text-align: center;
      color: #3b37c4;
      font-weight: bold;
    }
 
    h1 {
      font-size: 24px;
    }
 
    /* The grey box stands in for the live camera view */
    .camera-box {
      width: 100%;
      aspect-ratio: 1 / 1;            /* keeps the box square at any width */
      background-color: #d9d9d9;
      border: 8px solid #3b37c4;
      border-radius: 12px;
      box-sizing: border-box;         /* border counts inside the width */
    }
 
    .status {
      font-size: 24px;
      margin-top: 30px;
    }
 
    /* ---------- Bigger screens (tablets and computers) ---------- */
    @media (min-width: 700px) {
      .content {
        max-width: 500px;
      }
      h1 {
        font-size: 32px;
      }
    }
  </Style>
</head>

<body>
  <div class="header">
    <button id="menu-button">&#9776;</button>
 
    <div id="menu">
      <a href="index.html">Home </a>
      <a href="qr-scan.html">Scan Code </a>
      <a href="#">Challenge of the Day </a>
      <a href="profile-page.html">My Profile </a>
      <a href="locations.html">My Locations </a>
      <a href="#">Progress </a>
      <a href="#">Log Out </a>
    </div>
  </div>
 
  <div class="content">
    <h1>Scan QR Code Below &#128247;</h1>
 
    <!-- Put your camera feed inside this box later -->
    <div class="camera-box" id="camera-box"></div>
 
    <p class="status">Searching.....</p>
  </div>
 
  <script>
    // Click the hamburger button to show or hide the menu
    var button = document.getElementById("menu-button");
    var menu = document.getElementById("menu");
 
    button.onclick = function () {
      menu.classList.toggle("open");
    };
  </script>
</body>
