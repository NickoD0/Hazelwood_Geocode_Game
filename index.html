<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazelwood Geocode Extravaganza</title>

  <style>
    body {
      margin: 0;                      /* remove default browser spacing */
      background-color: #7CB7F1;
;      
      font-family: Arial, sans-serif;
    }

    /* Hamburger button & dropdown menu */
    .header {
      position: relative;             /* lets the menu sit under the button */
      padding: 16px;
    }

    #menu-button {
      font-size: 36px;
      background: none;
      border: none;
      cursor: pointer;
    }

    #menu {
      display: none;                  /* hidden until the button is clicked */
      position: absolute;
      top: 70px;
      left: 16px;
      width: 160px;
      padding: 10px;
      background-color: #3C3CC4;
;      
      border-radius: 12px;
    }

    #menu.open {
      display: block;                 /* JavaScript adds "open" to show it */
    }

    #menu a {
      display: block;
      padding: 8px;
      color: lightcyan;                 
      font-weight: bold;
      text-decoration: none;
    }

    /*Main content*/
    .content {
      max-width: 600px;               
      margin: 0 auto;                 /* Makes sure it's centered on big screens */
      padding: 0 16px 40px;
      text-align: center;
      color: #3b37c4;
    }

    h1 {
      font-size: 28px;
    }

    .card {
      width: 100%;                    /* Fills small screens... */
      max-width: 300px;               /* Stops growing at 300px */
      margin: 20px auto;
      padding-bottom: 10px;
      background-color: white;
      color: #222;
    }

    .card img {
      width: 100%;                    /* image shrinks with the card */
    }

  

    /* Bigger screens (tablets and computers)*/
    @media (min-width: 700px) {
      h1 {
        font-size: 40px;
      } 
      .card {
        max-width: 400px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <button id="menu-button">&#9776;</button>

    <div id="menu">
      <a href="index.html">Home </a>
      <a href="qr-scan.html">Scan Code </a>
      <a href="#">Challenge of the Day </a>
      <a href="profile-page.html">My Profile </a>
      <a href="locations.html">My Locations </a>
      <a href="#">Progress </a>
      <a href="#">Log Out </a>
    </div>
  </div>

  <div class="content">
    <h1>Today's Air Quality Rating</h1>

    <div class="card">
      <img src="happiest_cloud.png" alt="A smiling cloud">
    </div>

    <h2>[INSERT API DATA]</h2>
    <p>Could ask "what data do you want to see" and have a dropdown under the current AQI data</p>
  </div>

  <script>
    // Click the hamburger button to show or hide the menu
    var button = document.getElementById("menu-button");
    var menu = document.getElementById("menu");

    button.onclick = function () {
      menu.classList.toggle("open");
    };
  </script>
</body>
</html>
